<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Book Reading Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-gray-100 min-h-screen">
    <div class="max-w-4xl mx-auto p-6">
      <h1 class="text-3xl font-bold mb-4">TP: Book Reading tracker</h1>

      <section class="mb-6 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Add / Edit Book</h2>
        <form id="bookForm" class="grid grid-cols-2 gap-3">
          <input type="hidden" id="bookId" />
          <input
            required
            placeholder="Title"
            id="title"
            class="p-2 border rounded col-span-2"
          />
          <input
            required
            placeholder="Author"
            id="author"
            class="p-2 border rounded"
          />
          <input
            required
            type="number"
            min="1"
            placeholder="Number of pages"
            id="numberOfPages"
            class="p-2 border rounded"
          />
          <input
            type="number"
            min="0"
            placeholder="Pages read"
            id="pagesRead"
            class="p-2 border rounded"
          />
          <select id="status" class="p-2 border rounded">
            <option>Want to read</option>
            <option>Currently reading</option>
            <option>Read</option>
            <option>Re-read</option>
            <option>DNF</option>
            <option>Returned Unread</option>
          </select>
          <select id="format" class="p-2 border rounded">
            <option>Print</option>
            <option>PDF</option>
            <option>Ebook</option>
            <option>AudioBook</option>
          </select>
          <input
            type="number"
            min="0"
            placeholder="Price"
            id="price"
            class="p-2 border rounded"
          />
          <input
            placeholder="Suggested by"
            id="suggestedBy"
            class="p-2 border rounded"
          />
          <div class="col-span-2 flex gap-3">
            <button
              class="bg-blue-600 text-white px-4 py-2 rounded"
              id="saveBtn"
            >
              Save
            </button>
            <button
              type="button"
              id="resetBtn"
              class="px-4 py-2 rounded border"
            >
              Reset
            </button>
          </div>
        </form>
      </section>

      <section class="mb-6 bg-white p-4 rounded shadow">
        <h2 class="font-semibold mb-2">Books</h2>
        <div id="totals" class="mb-3 text-sm text-gray-700"></div>
        <div id="booksList" class="space-y-3"></div>
      </section>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
